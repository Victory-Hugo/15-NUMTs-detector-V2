# =====================================================================
# 3 exclude reference NUMTs — configuration
# 所有相对路径均相对于 project.base_dir
# =====================================================================

project:
  base_dir: "/mnt/f/Onedrive/文档（科研）/脚本/Download/15-NUMTs-detector-V2/2-整理tsv文件"  # 2-整理tsv文件项目根目录

# --------------------------------------------------------------------- #
# 路径配置：严格阈值输入、排除参考 NUMTs 后输出、参考表、Python 和日志目录
# --------------------------------------------------------------------- #
paths:
  python_dir: "python"  # Python 脚本目录
  log_dir: "log"  # shell wrapper 日志目录
  input_dir: "/mnt/l/20-NUMTs/1-原始结果/data/3-SLE/2-严格阈值"  # 严格阈值 tsv.gz 输入目录
  output_dir: "/mnt/l/20-NUMTs/1-原始结果/data/3-SLE/3-排除参考NUMTs后的严格阈值"  # 过滤后输出目录
  ref_file: "../9-参考NUMTs/output/整理后_仅考虑nuc断点_固定参考.tsv"  # 参考 NUMTs 表，需含 Chr/Nuc Start/Nuc End

# --------------------------------------------------------------------- #
# 工具配置：统一管理解释器
# --------------------------------------------------------------------- #
tools:
  python_bin: "python3"  # Python 解释器

# --------------------------------------------------------------------- #
# 运行参数：参考区间扩展窗口与输出覆盖策略
# --------------------------------------------------------------------- #
runtime:
  extension: 500  # 核侧坐标与参考 NUMTs 重叠判断的上下游扩展 bp
  overwrite: false  # 是否覆盖已有输出；命令行 --overwrite 可临时覆盖为 true
