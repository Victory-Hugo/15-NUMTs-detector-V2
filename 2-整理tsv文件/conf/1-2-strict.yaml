# =====================================================================
# 1-2 strict TSV filter — configuration
# 所有相对路径均相对于 project.base_dir
# =====================================================================

project:
  base_dir: "/mnt/f/Onedrive/文档（科研）/脚本/Download/15-NUMTs-detector-V2/2-整理tsv文件"  # 2-整理tsv文件项目根目录

# --------------------------------------------------------------------- #
# 路径配置：宽松阈值输入、严格阈值输出、Python 模块和日志目录
# --------------------------------------------------------------------- #
paths:
  python_dir: "python"  # Python 脚本目录
  log_dir: "log"  # shell wrapper 日志目录
  input_dir: "/mnt/l/20-NUMTs/1-原始结果/data/1-10K/1-宽松阈值/1-所有样本"  # 宽松阈值 tsv.gz 目录
  output_dir: "/mnt/l/20-NUMTs/1-原始结果/data/1-10K/2-严格阈值/1-所有样本"  # 严格阈值 tsv.gz 输出目录

# --------------------------------------------------------------------- #
# 工具配置：统一管理解释器
# --------------------------------------------------------------------- #
tools:
  python_bin: "python3"  # Python 解释器

# --------------------------------------------------------------------- #
# 运行参数：Cluster_No 阈值与输出覆盖策略
# --------------------------------------------------------------------- #
runtime:
  min_cluster_no: 5  # 保留 Cluster_No >= 该值的记录
  overwrite: true  # 是否覆盖已有输出；命令行 --overwrite 可临时覆盖为 true
