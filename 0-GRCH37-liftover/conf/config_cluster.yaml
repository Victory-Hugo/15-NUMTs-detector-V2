project:
  name: numts_liftover_grch37_to_grch38

liftover:
  bin: "/home/luolintao/miniconda3/envs/BigLin/bin/liftOver"
  chain: "/mnt/f/Onedrive/文档（科研）/脚本/Download/15-NUMTs-detector-V2/0-GRCH37-liftover/data/hg19ToHg38.over.chain.gz"
  min_match: 0.95

input:
  path: "/mnt/l/20-NUMTs/1-原始结果/data/1-10K/all_individuals_mt.disc.sam.cluster.concat.tsv"
  delimiter: "\t"
  has_header: true
  chr_col: "chr"
  start_col: "start"
  end_col: "end"
  reads_list_col: "reads"
  cluster_id_col: "Cluster_ID"
  chr_prefix: "chr"
  mt_chroms:
    - "MT"
    - "M"
    - "chrM"
    - "chrMT"

output:
  path: "/mnt/l/20-NUMTs/1-原始结果/data/1-10K/all_individuals_mt.disc.sam.cluster.GRCH38.concat.tsv"
  on_fail: "keep"  # keep|drop|na

runtime:
  threads: 4
  tmp_dir: "/mnt/f/Onedrive/文档（科研）/脚本/Download/15-NUMTs-detector-V2/0-GRCH37-liftover/tmp"
