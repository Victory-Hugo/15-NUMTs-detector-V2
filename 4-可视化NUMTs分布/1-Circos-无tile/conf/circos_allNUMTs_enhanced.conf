#*##############################################################################
#* 增强版 Circos 配置：保留原始配置不变，增加热点轨道和重点链接层
#*##############################################################################

#!#####################警告：请勿修改下列配置的顺序###############################
#!#####################警告：请勿修改下列配置的顺序###############################
#!#####################警告：请勿修改下列配置的顺序###############################

<<include housekeeping.conf>>
<<include colors_fonts_patterns.conf>>
<<include colors.brewer.conf>>
<<include colors.ucsc.conf>>
<<include custom_colors_enhanced.conf>>

anti_aliasing* = no
max_points_per_track* = 30000
max_links* = 30000000

<<include ideogram_NUMTs_enhanced.conf>>
<<include ticks_NUMTs.conf>>
<<include karyotype_NUMTs_enhanced.conf>>
karyotype* = karyotype.human.hg38.txt

<image>
angle_offset* = -90
file*  = ../output/CircosPlot_allNUMT_SLE_enhanced
svg*   = no
png*   = yes
radius* = 1700p
<<include image.conf>>
</image>

<plots>
<<include plots_numts_density.conf>>
</plots>

<links>
<link>
ribbon                = no
bezier_radius         = 0r
crest                 = 0.35
bezier_radius_purity  = 1
file                  = ../input/circos_SLE_background_sampled.txt
radius                = 0.965r
thickness             = 1.1
color                 = link_bg
stroke_color          = link_bg
z                     = 1

<rules>
<<include links_allBreakpoints.enhanced.conf>>
</rules>
</link>

<link>
ribbon                = no
bezier_radius         = 0r
crest                 = 0.55
bezier_radius_purity  = 1
file                  = ../input/circos_highlight_links.txt
radius                = 0.982r
thickness             = 4.5
color                 = link_highlight
stroke_color          = link_highlight
z                     = 20
</link>
</links>
