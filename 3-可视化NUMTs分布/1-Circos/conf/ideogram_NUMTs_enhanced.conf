<ideogram>

<spacing>
default = 0.002r
axis_break_at_edge = yes
axis_break = yes
axis_break_style = 2

<break_style 2>
stroke_color = chr_stroke
stroke_thickness = 3p
thickness = 1.6r
</break_style>

<pairwise hs1 hsM>
spacing = 4r
</pairwise>

<pairwise hsY hsM>
spacing = 4r
</pairwise>

</spacing>

radius = 0.82r
thickness = 50p
fill = yes
stroke_color = chr_stroke
stroke_thickness = 1p

show_label = yes
label_font = default
label_radius = 1.10r
label_size = 22
label_parallel = yes

show_bands = no
fill_bands = no
band_transparency = 4

radius* = 0.82r

</ideogram>
