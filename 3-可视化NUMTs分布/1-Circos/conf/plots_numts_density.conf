# 100 kb 分箱 NUMTs 热点轨道
# 数据格式: chr start end count
# 阈值按当前数据跨度手动分档，突出热点同时保留低密度背景

<plot>
type = histogram
file = ../input/numts_density_100kb.txt
r0 = 0.86r
r1 = 0.98r
orientation = out
min = 0
max = 17769
extend_bin = no
thickness = 1
stroke_thickness = 0
color = density_bin7
fill_color = density_bin7

<backgrounds>
<background>
color = density_track_bg
</background>
</backgrounds>

<rules>
<rule>
condition = var(value) >= 5000
fill_color = density_bin1
color = density_bin1
</rule>

<rule>
condition = var(value) >= 1000 && var(value) < 5000
fill_color = density_bin2
color = density_bin2
</rule>

<rule>
condition = var(value) >= 200 && var(value) < 1000
fill_color = density_bin3
color = density_bin3
</rule>

<rule>
condition = var(value) >= 50 && var(value) < 200
fill_color = density_bin4
color = density_bin4
</rule>

<rule>
condition = var(value) >= 10 && var(value) < 50
fill_color = density_bin5
color = density_bin5
</rule>

<rule>
condition = var(value) >= 4 && var(value) < 10
fill_color = density_bin6
color = density_bin6
</rule>
</rules>
</plot>
